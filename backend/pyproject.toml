[project]
name = "backend"
version = "0.1.0"
description = "Backend for Ask John Roderick"
readme = "README.md"
authors = [
    { name = "anselbrandt", email = "ansel@anselbrandt.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "logfire[fastapi,httpx,sqlalchemy,system-metrics]>=4.41.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.37.0",
    "pydantic-ai-slim[openai]>=2.37.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.75",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
